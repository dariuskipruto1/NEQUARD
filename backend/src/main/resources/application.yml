spring:
  application:
    name: nequard-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nequard}
    username: ${POSTGRES_USER:nequard}
    password: ${POSTGRES_PASSWORD:nequard_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

nequard:
  security:
    jwt-secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  monitoring:
    interval-ms: ${MONITORING_INTERVAL_MS:30000}
    timeout-ms: ${MONITORING_TIMEOUT_MS:2000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  address: 0.0.0.0
  port: ${PORT:8080}
