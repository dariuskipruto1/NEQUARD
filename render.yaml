services:
  - type: web
    name: nequard-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: nequard-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nequard-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: nequard-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: nequard-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: nequard-postgres
          property: password
  - type: web
    name: nequard-ml
    runtime: docker
    plan: free
    dockerfilePath: ./ml-service/Dockerfile
    dockerContext: ./ml-service
  - type: web
    name: nequard-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
databases:
  - name: nequard-postgres
    plan: free
    region: frankfurt
    databaseName: nequard_postgres
    user: nequard_postgres_user
