name: Generate frontend lockfile
on:
  workflow_dispatch:
  push:
    paths:
      - "frontend/package.json"
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile
        working-directory: frontend
        run: npm install --package-lock-only --force
      - name: Commit lockfile
        run: |
          if [ ! -f frontend/package-lock.json ]; then echo "lockfile missing"; exit 1; fi
          if git diff --quiet -- frontend/package-lock.json && git ls-files --error-unmatch frontend/package-lock.json >/dev/null 2>&1; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f frontend/package-lock.json
          git commit -m "Add frontend package lockfile"
          git push
